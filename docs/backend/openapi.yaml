openapi: 3.0.3
info:
  title: Платформа приёма граждан ВС КР
  description: |
    REST `/api/v1` для фронта Next.js.
    Тексты-сид: `content/*.json`. Пояснения: `docs/backend/README.md`.
    Часовой пояс Asia/Bishkek. JSON camelCase.
  version: "1.0.0"

servers:
  - url: https://api.example.gov.kg/api/v1
    description: Пример. Фронт задаёт NEXT_PUBLIC_API_URL без завершающего /.

tags:
  - name: Auth
  - name: Public
  - name: StaffAppointments
  - name: StaffAppeals
  - name: StaffCms
  - name: StaffSurvey
  - name: StaffAnalytics

security: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Вход сотрудника
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              login: staff.login
              password: "••••••••"
      responses:
        "200":
          description: JWT и профиль без пароля
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Error"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Выход (опционально инвалидация токена)
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Нет тела

  /auth/me:
    get:
      tags: [Auth]
      summary: Текущий сотрудник
      operationId: me
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Профиль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfile"
        "401":
          $ref: "#/components/responses/Error"

  /public/bootstrap:
    get:
      tags: [Public]
      summary: Тексты сайта, дерево допуска, календарь, опросник
      operationId: publicBootstrap
      responses:
        "200":
          description: Снимок для публичных страниц
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicBootstrap"

  /public/dates:
    get:
      tags: [Public]
      summary: Доступные дни записи
      operationId: publicDates
      parameters:
        - $ref: "#/components/parameters/TargetId"
      responses:
        "200":
          description: ISO-даты
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailableDatesResponse"

  /public/slots:
    get:
      tags: [Public]
      summary: Свободные слоты на дату и получателя
      operationId: publicSlots
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/TargetId"
        - name: excludeAppointmentId
          in: query
          required: false
          schema:
            type: string
          description: >
            При переносе — не считать занятым слот этой записи,
            чтобы гражданин мог оставить то же время.
      responses:
        "200":
          description: Свободные интервалы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotDayResponse"

  /public/appointments:
    post:
      tags: [Public]
      summary: Подать заявку. PIN только в этом ответе.
      operationId: bookAppointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookAppointmentRequest"
      responses:
        "201":
          description: Заявка создана, статус pending_review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookAppointmentResponse"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /public/recover-codes:
    post:
      tags: [Public]
      summary: Коды записей по телефону
      operationId: recoverCodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoverCodesRequest"
      responses:
        "200":
          description: Список кодов (можно пустой)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoverCodesResponse"

  /public/appointments/{code}:
    get:
      tags: [Public]
      summary: Публичный статус по коду (без PIN, без телефона в полном виде — по политике)
      operationId: lookupAppointment
      parameters:
        - $ref: "#/components/parameters/Code"
      responses:
        "200":
          description: Найдено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAppointmentLookup"
        "404":
          $ref: "#/components/responses/Error"

  /public/appointments/{code}/unlock:
    post:
      tags: [Public]
      summary: Полные данные записи после проверки PIN
      operationId: unlockAppointment
      parameters:
        - $ref: "#/components/parameters/Code"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockRequest"
      responses:
        "200":
          description: Запись без поля pin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAppointment"
        "409":
          $ref: "#/components/responses/Error"

  /public/appointments/{code}/actions:
    post:
      tags: [Public]
      summary: Отмена или перенос гражданином
      operationId: citizenAppointmentAction
      parameters:
        - $ref: "#/components/parameters/Code"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CitizenActionRequest"
      responses:
        "200":
          description: Обновлённая запись
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAppointment"
        "409":
          $ref: "#/components/responses/Error"

  /public/appointments/{code}/feedback:
    post:
      tags: [Public]
      summary: Оценка приёма (после проведения)
      operationId: submitFeedback
      parameters:
        - $ref: "#/components/parameters/Code"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackRequest"
      responses:
        "204":
          description: Принято
        "409":
          $ref: "#/components/responses/Error"

  /public/survey:
    get:
      tags: [Public]
      summary: Анкета судов
      operationId: publicSurvey
      responses:
        "200":
          description: Мета и вопросы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyBundle"
    post:
      tags: [Public]
      summary: Ответ на анкету (анонимно)
      operationId: submitSurvey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitSurveyRequest"
      responses:
        "204":
          description: Принято

  /staff/appointments:
    get:
      tags: [StaffAppointments]
      summary: Список заявок
      operationId: listAppointments
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/AppointmentStatus"
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: targetId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Заявки без PIN
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicAppointment"

  /staff/appointments/{id}/confirm:
    post:
      tags: [StaffAppointments]
      summary: Подтвердить заявку
      operationId: confirmAppointment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmRequest"
      responses:
        "200":
          description: status=confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAppointment"

  /staff/appointments/{id}/reject:
    post:
      tags: [StaffAppointments]
      summary: Не подтвердить
      operationId: rejectAppointment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRequest"
      responses:
        "200":
          description: status=rejected, карточка cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAppointment"

  /staff/appointments/{id}/cancel:
    post:
      tags: [StaffAppointments]
      operationId: staffCancelAppointment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRequest"
      responses:
        "200":
          description: Отменено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAppointment"

  /staff/appointments/{id}/restore:
    post:
      tags: [StaffAppointments]
      operationId: restoreAppointment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Снова confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAppointment"

  /staff/appointments/{id}:
    patch:
      tags: [StaffAppointments]
      summary: Правка данных гражданина
      operationId: patchAppointment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchAppointmentRequest"
      responses:
        "200":
          description: Обновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAppointment"

  /staff/appointments/{id}/status:
    post:
      tags: [StaffAppointments]
      operationId: setAppointmentStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetStatusRequest"
      responses:
        "200":
          description: Статус записи и этап карточки согласованы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAppointment"

  /staff/appointments/{id}/reschedule:
    post:
      tags: [StaffAppointments]
      operationId: staffReschedule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleRequest"
      responses:
        "200":
          description: status=rescheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAppointment"
        "409":
          $ref: "#/components/responses/Error"

  /staff/appeals:
    get:
      tags: [StaffAppeals]
      operationId: listAppeals
      security:
        - bearerAuth: []
      parameters:
        - name: stage
          in: query
          schema:
            $ref: "#/components/schemas/AppealStage"
      responses:
        "200":
          description: Карточки
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppealCard"

  /staff/appeals/{id}:
    get:
      tags: [StaffAppeals]
      operationId: getAppeal
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Карточка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealCard"
        "404":
          $ref: "#/components/responses/Error"

  /staff/appeals/{id}/prep:
    post:
      tags: [StaffAppeals]
      summary: Завершить предварительный анализ
      operationId: completePrep
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletePrepRequest"
      responses:
        "200":
          description: stage=under_review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealCard"

  /staff/appeals/{id}/ready:
    post:
      tags: [StaffAppeals]
      operationId: markReady
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: stage=ready_for_reception
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealCard"

  /staff/appeals/{id}/reception:
    post:
      tags: [StaffAppeals]
      summary: Протокол личного приёма и поручение
      operationId: completeReception
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteReceptionRequest"
      responses:
        "200":
          description: stage=reception_done, появляется assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealCard"

  /staff/appeals/{id}/control:
    post:
      tags: [StaffAppeals]
      operationId: addControlLog
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddControlLogRequest"
      responses:
        "200":
          description: Добавлена запись журнала
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealCard"

  /staff/appeals/{id}/assignment-status:
    post:
      tags: [StaffAppeals]
      operationId: setAssignmentStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAssignmentStatusRequest"
      responses:
        "200":
          description: Статус поручения
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealCard"

  /staff/appeals/{id}/answer:
    post:
      tags: [StaffAppeals]
      operationId: submitFinalAnswer
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitFinalAnswerRequest"
      responses:
        "200":
          description: >-
            stage=closed (ответ гражданину = завершение обращения;
            оценка гражданина через /public/appeals/{code}/feedback не
            меняет stage и не требуется для его установки)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealCard"

  /staff/appeals/{id}/stage:
    post:
      tags: [StaffAppeals]
      operationId: setAppealStage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAppealStageRequest"
      responses:
        "200":
          description: Этап изменён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealCard"

  /staff/calendar:
    get:
      tags: [StaffCms]
      operationId: getCalendar
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Настройки слотов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarSettings"
    put:
      tags: [StaffCms]
      operationId: putCalendar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarSettings"
      responses:
        "200":
          description: Сохранено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarSettings"

  /staff/content:
    get:
      tags: [StaffCms]
      operationId: getContent
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Как content/site.json
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    put:
      tags: [StaffCms]
      operationId: putContent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Сохранено
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /staff/eligibility:
    get:
      tags: [StaffCms]
      operationId: getEligibility
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Дерево допуска
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EligibilityPayload"
    put:
      tags: [StaffCms]
      operationId: putEligibility
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EligibilityPayload"
      responses:
        "200":
          description: Сохранено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EligibilityPayload"

  /staff/survey:
    get:
      tags: [StaffSurvey]
      operationId: getSurveyAdmin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Мета и вопросы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyBundle"
    put:
      tags: [StaffSurvey]
      operationId: putSurveyAdmin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SurveyBundle"
      responses:
        "200":
          description: Сохранено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyBundle"

  /staff/survey/responses:
    get:
      tags: [StaffSurvey]
      operationId: listSurveyResponses
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Ответы
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SurveyResponse"

  /staff/analytics:
    get:
      tags: [StaffAnalytics]
      operationId: analytics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Сводка для руководства
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResponse"

  /staff/users:
    get:
      tags: [StaffAppointments]
      summary: Сотрудники для выбора ответственного
      operationId: listStaffUsers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Без паролей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffProfile"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TargetId:
      name: targetId
      in: query
      required: true
      schema:
        type: string
        example: chairman
    Code:
      name: code
      in: path
      required: true
      schema:
        type: string
        example: VS-2026-1842
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: Ошибка
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    ApiError:
      type: object
      required: [status, code, message]
      properties:
        status:
          type: integer
          example: 409
        code:
          type: string
          example: SLOT_UNAVAILABLE
        message:
          type: string

    Role:
      type: string
      enum: [reception, leadership, responsible, admin]

    AppointmentStatus:
      type: string
      enum:
        - pending_review
        - confirmed
        - rescheduled
        - cancelled
        - rejected
        - completed
        - no_show

    AppealStage:
      type: string
      enum:
        - registered
        - under_review
        - ready_for_reception
        - reception_done
        - in_control
        - closed
        - cancelled

    AppealCategory:
      type: string
      enum: [organization, court_activity, legislation, other]

    AssignmentStatus:
      type: string
      enum: [open, in_progress, done, overdue]

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
        password:
          type: string

    StaffProfile:
      type: object
      required: [id, login, fullName, role, position]
      properties:
        id:
          type: string
        login:
          type: string
        fullName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        position:
          type: string
        department:
          type: string

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/StaffProfile"

    Companion:
      type: object
      required: [fullName]
      properties:
        fullName:
          type: string
        phone:
          type: string

    TimeSlot:
      type: object
      required: [start, end, label]
      properties:
        start:
          type: string
          example: "09:00"
        end:
          type: string
          example: "09:20"
        label:
          type: string
          example: "09:00 – 09:20"

    HistoryItem:
      type: object
      required: [at, action]
      properties:
        at:
          type: string
          format: date-time
        action:
          type: string
        detail:
          type: string

    PublicAppointment:
      type: object
      required:
        - id
        - code
        - fullName
        - phone
        - topic
        - category
        - date
        - slotStart
        - slotEnd
        - status
        - targetId
        - companions
        - createdAt
        - updatedAt
        - history
      properties:
        id:
          type: string
        code:
          type: string
        fullName:
          type: string
        phone:
          type: string
        email:
          type: string
        topic:
          type: string
        category:
          $ref: "#/components/schemas/AppealCategory"
        description:
          type: string
        date:
          type: string
          format: date
        slotStart:
          type: string
        slotEnd:
          type: string
        status:
          $ref: "#/components/schemas/AppointmentStatus"
        targetId:
          type: string
        companions:
          type: array
          items:
            $ref: "#/components/schemas/Companion"
        reviewNote:
          type: string
        createdAt:
